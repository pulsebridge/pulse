/* Dark-only by design: black canvas, liquid-glass panels, white energy wires. */
:root {

    --gap: 14px; --bar-h: 40px; --sb-h: 30px; --sb: 38px; --r-chrome: 12px; --chrome-shadow: inset 0 1px 0 rgba(255, 255, 255, .10), 0 8px 24px rgba(0, 0, 0, .4); --ease: cubic-bezier(.32, .72, 0, 1); --slide: .3s; --top-y: calc(var(--gap) * 2 + var(--bar-h)); --bot-y: var(--gap);
    color-scheme: dark;
}
* { box-sizing: border-box; }

:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); outline-offset: 2px; }

/* Status colors, used by dots, labels and wires */
.working { --sc: var(--text); } .quiet, .stopping { --sc: var(--amber); } .needs-you { --sc: var(--red); } .done, .ended { --sc: var(--green); } .idle { --sc: var(--text-3); }

.glass { background: var(--glass); backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); border: 1px solid rgba(255, 255, 255, .09); box-shadow: var(--glass-edge); }

#canvas { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none;

.w-base { fill: none; stroke: rgba(255, 255, 255, .16); stroke-width: 1.4; }

.c-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.c-ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--card-2); border: 1px solid var(--line); color: var(--text-2); flex: none; }

.state { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--sc); white-space: nowrap; }

.c-body { padding: 12px 14px 4px; }
.c-label { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
.c-task { font-size: 13.5px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* The asks as a plain numbered list, each number in a small circle. Reference only: nothing changes when one is done. */
.c-plan { list-style: none; margin: 12px 0 2px; padding: 0; counter-reset: ask; border-radius: 12px; background: var(--void); border: 1px solid var(--line); overflow: hidden; }
.c-plan li { display: flex; align-items: baseline; gap: 12px; padding: 9px 12px; font-size: 12.5px; line-height: 1.4; color: var(--text-2); counter-increment: ask; }
.c-plan li + li { border-top: 1px solid var(--line); }
.c-plan li::before { content: counter(ask, decimal-leading-zero); flex: none; font: 500 11px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: .04em; color: var(--yellow); opacity: .9; }
.box .c-plan { margin-top: 14px; }
.main .c-task { padding: 10px 12px; border-radius: 12px; background: var(--void); border: 1px solid var(--line); font-size: 13px; line-height: 1.5; -webkit-line-clamp: 4; }
.c-now { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 10px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line); font: 400 12.5px var(--mono); }
.c-now svg { width: 12px; height: 12px; color: var(--sc); flex: none; }

.c-note:empty { display: none; }
/* Expanded card: the whole prompt and note, plus the last few steps */
.c-exp { all: unset; box-sizing: border-box; cursor: pointer; width: 24px; height: 24px; margin-right: -4px; border-radius: 7px; display: grid; place-items: center; color: var(--text-3); flex: none; transition: background-color .1s linear, color .1s linear; }

.c-steps { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 3px; }

/* Ports: glowing flares where energy enters and leaves a card */
.port { position: absolute; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, .35); transform: translate(-50%, -50%); pointer-events: none; }
.port.out { left: 100%; }

.port.live { width: 14px; height: 60px; background: radial-gradient(ellipse at center, rgba(255, 255, 255, .95) 0 6%, rgba(255, 255, 255, .45) 16%, rgba(255, 255, 255, .08) 45%, transparent 70%); animation: flare 2.2s ease-in-out infinite; }
.needs-you .port.live { background: radial-gradient(ellipse at center, rgba(255, 140, 140, .95) 0 6%, rgba(255, 107, 107, .45) 16%, rgba(255, 107, 107, .08) 45%, transparent 70%); }
@keyframes flare { 50% { opacity: .65; } }
.card.project { width: 300px; }
.c-path { font: 400 12px var(--mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0 4px; }
.p-stats div { padding: 8px 10px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line); }
.p-stats b { display: block; font: 500 16px var(--mono); }
.p-stats span { font-size: 11.5px; color: var(--text-3); }
.card::before { content: ""; position: absolute; left: 14px; top: 0; height: 2px; width: calc((100% - 28px) * var(--elapsed, 0)); border-radius: 2px; background: linear-gradient(90deg, rgba(255, 255, 255, .15), rgba(255, 255, 255, .55)); transition: width 1s linear; }
.card.quiet::before, .card.stuck::before { background: linear-gradient(90deg, rgba(244, 182, 89, .2), var(--amber)); }
.card.stuck { border-color: rgba(244, 182, 89, .5); }
.card.stuck .c-head::after { content: "Stuck?"; font: 500 10.5px var(--mono); letter-spacing: .05em; color: var(--amber); border: 1px solid rgba(244, 182, 89, .45); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
/* Finish: a green bolt of the same energy as the wires runs twice around the card, lights its edge, then fades slowly. */
.done-bolt { position: absolute; left: -1px; top: -1px; overflow: visible; pointer-events: none; filter: drop-shadow(0 0 6px rgba(91, 228, 155, .7)); animation: bolt-fade 4.2s ease-in forwards; }
.done-bolt rect { fill: none; stroke: var(--green); stroke-linecap: round; }
.done-bolt .b-halo { stroke-width: 7; opacity: .25; stroke-dasharray: 28 72; animation: bolt-run 1s cubic-bezier(.45, 0, .55, 1) 2, bolt-out .5s 1.8s ease forwards; }
.done-bolt .b-core { stroke: #D6FFE6; stroke-width: 2.2; stroke-dasharray: 18 82; animation: bolt-run 1s cubic-bezier(.45, 0, .55, 1) 2, bolt-out .5s 1.8s ease forwards; }
.done-bolt .b-edge { stroke-width: 1.5; opacity: 0; animation: bolt-edge 4.2s ease forwards; }
@keyframes bolt-run { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
@keyframes bolt-out { to { opacity: 0; } }
@keyframes bolt-edge { 0%, 15% { opacity: 0; } 45% { opacity: .8; } 100% { opacity: 0; } }
@keyframes bolt-fade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
.card.done, .card.ended { border-color: rgba(91, 228, 155, .22); }
.wire.done .w-base, .wire.ended .w-base { stroke: rgba(91, 228, 155, .32); }
.needs-flash { position: absolute; inset: -1px; border-radius: 18px; border: 2px solid var(--red); pointer-events: none; animation: blip .9s ease-out forwards; }
.wire.settle { --wc: var(--green); }
.wire.settle .w-base { stroke: var(--green); stroke-width: 2; transition: stroke 1.4s ease, stroke-width 1.4s ease; }

#frames { position: absolute; left: 0; top: 0; }
.arr-frame { position: absolute; left: 0; top: 0; border-radius: calc(18px / var(--k, 1)); border: calc(1.5px / var(--k, 1)) dashed rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .03); cursor: grab; touch-action: none; transition: border-color .12s linear, background-color .12s linear; }

.arr-frame b { position: absolute; left: calc(14px / var(--k, 1)); top: calc(-40px / var(--k, 1)); font: 500 calc(15px / var(--k, 1)) "Geist", sans-serif; padding: calc(5px / var(--k, 1)) calc(12px / var(--k, 1)); border-radius: calc(10px / var(--k, 1)); background: rgba(23, 23, 26, .95); border: calc(1px / var(--k, 1)) solid var(--line-2); white-space: nowrap; }
body.arranging .card { pointer-events: none; opacity: .5; }

.arr-bar { position: fixed; top: var(--top-y); left: var(--mid); transform: translate(-50%, -6px); z-index: 17; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 14px; font-size: 13.5px; color: var(--text-2); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; max-width: calc(100vw - 32px); }

.pbtn.primary { background: var(--text); color: #0B0B0C; font-weight: 500; }

.recap { position: fixed; top: var(--top-y); right: calc(var(--rw) + var(--gap) * 2); z-index: 16; width: min(340px, calc(100vw - 32px)); padding: 14px 16px; border-radius: 16px; opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .25s ease, transform .25s ease; }

/* The Pulse mark: the black blob on its green tile, drawn by the SVG itself. */
.mark { width: 30px; height: 30px; display: grid; place-items: center; flex: none; }
/* In the activity bar the mark is also a button: it collapses and expands the sidebar, like #collapse. */

.mark svg { width: 30px; height: 30px; display: block; border-radius: 8px; }
.ib { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--text-2); flex: none; transition: background-color .1s linear, color .1s linear; }

.act { position: relative; flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0 12px; border-right: 1px solid var(--line); background: rgba(0, 0, 0, .16); transition: background-color var(--slide) var(--ease), border-color var(--slide) var(--ease); }

.act-btn { all: unset; box-sizing: border-box; cursor: pointer; position: relative; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--text-3); flex: none; transition: background-color .12s linear, color .12s linear; }
.act-btn:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
.act-btn:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); }
.act-btn svg { width: 19px; height: 19px; }
.act-btn.on, .act-btn[aria-pressed="true"]:not([data-mode]) { color: var(--text); background: rgba(255, 255, 255, .09); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
.act-btn.on::before { content: ""; position: absolute; left: -12px; top: 11px; bottom: 11px; width: 3px; border-radius: 0 3px 3px 0; background: var(--text); box-shadow: 0 0 10px rgba(255, 255, 255, .45); }
.bdg { position: absolute; right: 0; top: 0; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; font: 600 10px/17px var(--mono); text-align: center; color: #0B0B0C; background: #D9D9DE; box-shadow: 0 0 0 2px #151518; pointer-events: none; }
.bdg:empty { display: none; }
.bdg.red { background: var(--red); color: #1C0707; }
.act-sp { flex: 1; min-height: 8px; width: 100%; display: flex; flex-direction: column; align-items: center; overflow-y: auto; scrollbar-width: none; }
.act-sp::-webkit-scrollbar { display: none; }
.act-sep { display: none; width: 24px; height: 1px; flex: none; margin: 10px 0 8px; background: var(--line-2); }
.left.rail .act-sep { display: block; animation: fade-in .2s ease .12s both; }
@keyframes fade-in { from { opacity: 0; } }
#voice-mini[aria-pressed="true"] { color: var(--yellow); background: rgba(255, 210, 31, .10); box-shadow: inset 0 0 0 1px rgba(255, 210, 31, .22); }
#voice-mini[aria-pressed="false"] svg { opacity: .7; }
/* Voice lives in the activity bar; the old footer row stays in the DOM only because #voice drives it. */
.l-foot { display: none; }
#voice-mini, #collapse, #d-settings { width: 32px; height: 32px; border-radius: 10px; }
#voice-mini svg, #collapse svg, #d-settings svg { width: 16px; height: 16px; }
.l-rail { display: none; flex-direction: column; align-items: center; gap: 8px; padding: 2px 0 6px; }
.left.rail .l-rail { display: flex; animation: fade-in .2s ease .12s both; }
/* The open view */
/* Full width even while the sidebar is narrower: the edge slides over it and it fades, so nothing re-wraps mid-animation. */
.l-main { flex: none; width: calc(var(--side) - 64px); display: flex; flex-direction: column; transition: opacity .22s ease .06s, visibility 0s; }
.left.rail .l-main { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .12s ease, visibility 0s linear var(--slide); }
.l-head { display: flex; align-items: center; gap: 10px; padding: 15px 14px 6px 16px; }
.brand { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; white-space: nowrap; }
.brand b { font-size: 14px; font-weight: 600; letter-spacing: .16em; }
.brand span { margin-top: 4px; font-size: 11px; letter-spacing: .05em; color: var(--text-3); }
.l-view { flex: 1; min-height: 0; display: none; flex-direction: column; }
.left[data-mode="crew"] #v-crew, .left[data-mode="files"] #v-ws, .left[data-mode="changes"] #v-ws { display: flex; }
.left[data-mode="files"] #ws-changes, .left[data-mode="changes"] #ws-explorer { display: none; }
#v-ws { padding: 0 10px 8px 12px; }
.ws-bar { display: flex; align-items: baseline; gap: 8px; margin: 14px 4px 8px; }
.ws-bar .sec { margin: 0; }
.ws-note { margin-left: auto; font: 400 11.5px var(--mono); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-note.warn { color: var(--amber); font-family: inherit; }
.ws-mount { flex: 1; min-height: 0; overflow: auto; position: relative; margin: 0 -4px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .12) transparent; }
.ws-empty { padding: 22px 12px; color: var(--text-3); font-size: 13px; line-height: 1.5; text-align: center; }
.ws-empty b { display: block; color: var(--text-2); font-weight: 500; margin-bottom: 4px; }
/* Project picker for Files and Changes */
.pick { position: relative; margin-bottom: 10px; }
.pick-btn { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) 14px; gap: 10px; align-items: center; padding: 7px 10px 7px 7px; border-radius: 12px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); transition: background-color .1s linear, border-color .1s linear; }
.pick-btn:hover, .pick-btn[aria-expanded="true"] { background: rgba(255, 255, 255, .07); border-color: var(--line-2); }
.pick-btn:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); }
.pick-btn > svg { width: 14px; height: 14px; color: var(--text-3); transition: transform .15s ease; }
.pick-btn[aria-expanded="true"] > svg { transform: rotate(180deg); }
.pick-t { min-width: 0; display: grid; line-height: 1.3; }
.pick-t b { font: 500 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-t span { font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-menu { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 6; padding: 6px; border-radius: 14px; max-height: min(60vh, 440px); overflow-y: auto; background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .02)), rgba(22, 22, 26, .97); border: 1px solid var(--line-2); box-shadow: 0 24px 60px rgba(0, 0, 0, .6); scrollbar-width: thin; }
.pick-menu[hidden] { display: none; }
.pick-opt { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 9px; }
.pick-opt:hover, .pick-opt:focus-visible { background: rgba(255, 255, 255, .08); outline: none; }
.pick-opt > i { width: 7px; height: 7px; border-radius: 50%; background: var(--sc); }
.pick-opt > span:nth-child(2) { min-width: 0; display: grid; line-height: 1.3; }
.pick-opt b { font: 500 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-opt small { font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-opt .n { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.pick-opt .n svg { width: 14px; height: 14px; color: var(--text); display: block; }
.pick-opt.open { grid-template-columns: 16px minmax(0, 1fr); }
.pick-opt.open > svg { width: 16px; height: 16px; color: var(--text-2); }
.pick-sep { display: block; height: 1px; margin: 6px 6px; background: var(--line); }
.l-rail button { all: unset; cursor: pointer; position: relative; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font: 500 12px var(--mono); background: rgba(255, 255, 255, .05); border: 1px solid var(--line); flex: none; }
.l-rail button:hover { background: rgba(255, 255, 255, .1); }
.l-rail button:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); }
.l-rail button i { position: absolute; right: -2px; top: -2px; width: 9px; height: 9px; border-radius: 50%; background: var(--sc); border: 2px solid #18181B; }
.l-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 12px 14px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .12) transparent; }
.sec { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 16px 4px 8px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); min-width: 0; }
.tile b { display: block; font: 500 20px var(--mono); white-space: nowrap; }
.tile span { font-size: 12px; color: var(--text-3); }
.tile.alert b { color: var(--red); }
button.tile { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 8px; padding: 11px 12px; border-radius: 14px; background: rgba(255, 255, 255, .035); border: 1px solid var(--line); transition: background-color .1s linear, border-color .1s linear; }
button.tile:hover { background: rgba(255, 255, 255, .07); }
button.tile:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); }
button.tile b { grid-column: 1; font: 500 22px var(--mono); line-height: 1.1; }
button.tile > span:last-child { grid-column: 1 / -1; font-size: 12px; color: var(--text-3); margin-top: 2px; }
.t-ic { grid-column: 2; grid-row: 1; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: rgba(255, 255, 255, .06); color: var(--text-2); }
.t-ic svg { width: 14px; height: 14px; }
.t-needs b { color: var(--red); }
.t-needs .t-ic { color: var(--red); background: rgba(255, 107, 107, .12); }
.t-needs.hot { background: rgba(255, 107, 107, .1); border-color: rgba(255, 107, 107, .45); animation: attention 1.8s ease-in-out infinite; }
.t-done b { color: var(--green); }
.t-done .t-ic { color: var(--green); background: rgba(91, 228, 155, .12); }
.t-rate .t-ic { color: var(--yellow); background: rgba(255, 210, 31, .1); }
button.tile.on { border-color: rgba(255, 255, 255, .4); background: rgba(255, 255, 255, .08); }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 11px; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); }
.seg button { all: unset; cursor: pointer; flex: 1; text-align: center; padding: 5px 0; border-radius: 8px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: rgba(255, 255, 255, .1); color: var(--text); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
.seg button:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); }
.sess { margin-top: 6px; }
.s-row { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 6px; border-radius: 10px; }
.s-row:hover { background: rgba(255, 255, 255, .05); }
.s-row:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); }
.s-row svg { width: 13px; height: 13px; color: var(--text-3); transition: transform .15s ease; flex: none; }
.sess.closed .s-row svg { transform: rotate(-90deg); }
.s-row b { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-row span { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.sess.closed .agents { display: none; }
.a-row { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 8px 58px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; padding: 7px 8px 7px 24px; border-radius: 10px; font-size: 13px; }
.a-row:hover { background: rgba(255, 255, 255, .05); }
.a-row.sel { background: rgba(255, 255, 255, .09); }
.a-row:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); }
.a-row i { width: 7px; height: 7px; border-radius: 50%; background: var(--sc); }
.a-row code { font: 500 12.5px var(--mono); display: inline-flex; align-items: center; gap: 5px; }
.a-row code svg { width: 13px; height: 13px; flex: none; color: var(--text-3); }
.a-row .t { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-row time { font: 400 11.5px var(--mono); color: var(--text-3); }
.a-row.done, .a-row.ended { opacity: .6; }
.a-row.d0 { padding-left: 24px; color: var(--text-3); }
.a-row.d0 svg { width: 13px; height: 13px; color: var(--text-3); }
.a-row.d0 code { color: var(--text-2); }
.a-row.d2 { padding-left: 42px; }
.empty { color: var(--text-3); font-size: 13px; padding: 8px 4px; margin: 0; }
.l-foot { display: none; align-items: center; gap: 8px; margin: 0 10px 8px; padding: 6px 4px 6px 10px; border-top: 1px solid var(--line); }
.vtext { flex: 1; min-width: 0; font-size: 12px; line-height: 1.3; }
.vtext b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vtext b em { font-style: normal; color: var(--text-2); font-weight: 400; }
.vtext span { display: none; }
.switch { all: unset; cursor: pointer; width: 30px; height: 18px; border-radius: 9px; background: rgba(255, 255, 255, .12); position: relative; flex: none; transition: background-color .15s linear; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s ease; }
.switch[aria-checked="true"] { background: var(--yellow); }
.switch[aria-checked="true"]::after { transform: translateX(12px); background: #111; }
.switch:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); outline-offset: 2px; }

/* ---------- Command bar: search (⌘K) with results, the crew's heartbeat, the time ---------- */
.top { position: fixed; top: var(--gap); left: calc(var(--lw) + var(--gap) * 2); right: calc(var(--rw) + var(--gap) * 2); display: flex; justify-content: center; gap: 10px; z-index: 18; pointer-events: none; transition: left var(--slide) var(--ease), right var(--slide) var(--ease); }
/* The results are the bar's sibling, not its child: a backdrop filter inside another one only blurs its parent. */
/* The top bar is one small pill of icons; search is a palette that ⌘K (or the magnifier) opens in the middle. */
.tbar { pointer-events: auto; position: relative; display: flex; align-items: center; gap: 2px; height: var(--bar-h); padding: 4px; border-radius: var(--r-chrome); box-shadow: var(--chrome-shadow); }
.tbar button { all: unset; box-sizing: border-box; cursor: pointer; flex: none; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2); transition: background-color .12s linear, color .12s linear, transform .08s ease; }
.tbar button svg { width: 16px; height: 16px; }
.tbar button:hover { background: rgba(255, 255, 255, .06); color: var(--text); }
.tbar button:active { transform: scale(.94); }
.tbar button:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); outline-offset: 1px; }
.tbar button[aria-pressed="true"] { color: var(--text); background: rgba(255, 255, 255, .10); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
.tbar button[aria-disabled="true"] { opacity: .45; cursor: default; }
.tbar .sep { flex: none; width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, .10); }
/* The primary action: the only yellow in the bar. Pressed, a soft ring breathes until the update arrives. */
.tbar #d-report { width: 36px; color: var(--yellow); background: linear-gradient(180deg, rgba(255, 210, 31, .16), rgba(255, 210, 31, .05)); box-shadow: inset 0 0 0 1px rgba(255, 210, 31, .30); }
.tbar #d-report:hover { color: #FFE58A; background: linear-gradient(180deg, rgba(255, 210, 31, .26), rgba(255, 210, 31, .1)); box-shadow: inset 0 0 0 1px rgba(255, 210, 31, .45), 0 0 18px rgba(255, 210, 31, .18); }
.tbar #d-report.busy { cursor: progress; animation: report-busy 1.1s ease-in-out infinite; }
@keyframes report-busy { 50% { box-shadow: inset 0 0 0 1px rgba(255, 210, 31, .55), 0 0 0 4px rgba(255, 210, 31, .12), 0 0 22px rgba(255, 210, 31, .3); } }
@media (prefers-reduced-motion: reduce) { .tbar #d-report.busy { animation: none; box-shadow: inset 0 0 0 1px rgba(255, 210, 31, .6); } .tbar button:active { transform: none; } }
/* With a file or diff open (workspace.js sets body.ws-editor), the graph-only buttons give way to a way back to the graph. */
.tbar #d-graph { display: none; }
body.ws-editor .tbar #d-graph { display: grid; }
body.ws-editor .tbar :is(#d-out, #d-fit, #d-in, #d-arrange) { display: none; }
/* Between a wide sidebar and an open panel, zooming stays on scroll and the - and + keys. */
.top { container-type: inline-size; }
@container (max-width: 380px) { .tbar :is(#d-out, #d-in) { display: none; } }
/* Tooltips for the icon buttons: the name and its key. After a short pause on hover, at once on keyboard focus. */
.tip { position: fixed; left: 0; top: 0; z-index: 70; display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; border-radius: 6px; background: rgba(12, 12, 14, .94); border: 1px solid rgba(255, 255, 255, .08); font-size: 12px; color: var(--text); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(-50%, -2px); transition: opacity .12s ease, transform .12s ease; }
.tip.show { opacity: 1; transform: translate(-50%, 0); }
.tip kbd { font: 11px var(--mono); color: var(--text-2); }
.tip kbd:empty { display: none; }
/* ---------- Search (⌘K): a centered palette over a dimmed canvas ---------- */
.pal-back { position: fixed; inset: 0; z-index: 60; background: rgba(4, 4, 6, .45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; transition: opacity .1s linear; }
.pal-back[hidden] { display: none; }
.pal-back.show { opacity: 1; transition-duration: .16s; }
.pal { position: absolute; left: 50%; top: clamp(64px, 14vh, 128px); width: min(640px, calc(100vw - 32px)); border-radius: 16px; overflow: hidden; background: rgba(18, 18, 22, .88); border-color: rgba(255, 255, 255, .10); box-shadow: 0 24px 80px rgba(0, 0, 0, .6); transform: translateX(-50%) translateY(-6px) scale(.98); transition: transform .16s var(--ease); }
.pal-back.show .pal { transform: translateX(-50%); }
@media (prefers-reduced-motion: reduce) { .pal { transform: translateX(-50%); transition: none; } }
.pal-q { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--line); color: var(--text-3); cursor: text; }
.pal-q svg { width: 18px; height: 18px; flex: none; }
.pal-q input { flex: 1; min-width: 0; height: 100%; padding: 0; background: none; border: 0; outline: none; color: var(--text); font-size: 16px; }
.pal-q input::placeholder { color: var(--text-3); }
.pal-q input::-webkit-search-cancel-button { display: none; }
.pal-q kbd { flex: none; font: 500 11px var(--mono); color: var(--text-3); border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 6px; }
.pal .results { position: static; display: block; width: auto; transform: none; max-height: min(420px, 60vh); padding: 6px; border-radius: 0; background: none; }
.pal .results button { min-height: 40px; font-size: 14px; }
.pal-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 32px; margin: 0; padding: 0 14px; border-top: 1px solid var(--line); font: 11px var(--mono); color: var(--text-3); }
.cmd-st { display: flex; align-items: center; gap: 10px; min-width: 0; overflow: hidden; white-space: nowrap; color: var(--text-2); }
.cmd-st b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.cmd-st .txt { display: inline-flex; align-items: center; gap: 10px; }
.cmd-needs { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 8px; color: #FFB3B3; background: rgba(255, 107, 107, .12); box-shadow: inset 0 0 0 1px rgba(255, 107, 107, .32); transition: background-color .12s linear; }
.cmd-needs b { color: #FF8A8A; }
.cmd-needs:hover { background: rgba(255, 107, 107, .22); }
.cmd-needs:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); }
.cmd-clock { flex: none; font: 500 12px var(--mono); color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* ---------- Status bar: the crew's heartbeat on the left; plan limits and the time on the right ---------- */
.sbar { position: fixed; left: calc(var(--lw) + var(--gap) * 2); right: calc(var(--rw) + var(--gap) * 2); bottom: var(--gap); height: var(--sb-h); z-index: 15; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 14px; border-radius: var(--r-chrome); box-shadow: var(--chrome-shadow); font-size: 12.5px; container-type: inline-size; transition: left var(--slide) var(--ease), right var(--slide) var(--ease); }
.sb-r { flex: none; display: flex; align-items: center; gap: 14px; }
.sb-sep { width: 1px; height: 14px; background: var(--line-2); }
@container (max-width: 560px) { .lim small, .cmd-st .demo-tag { display: none; } }
@container (max-width: 440px) { .cmd-clock, .sb-sep, .cmd-st .lbl { display: none; } }
@container (max-width: 340px) { .lim i { display: none; } .cmd-lim { gap: 8px; } }
/* Plan limits: the 5-hour and weekly windows as two small meters. Yellow, amber from 75 %, red from 90 %. */
.cmd-lim { flex: none; display: flex; align-items: center; gap: 12px; }
.lim { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: default; }
.lim em { font: 500 11px var(--mono); font-style: normal; color: var(--text-2); }
.lim i { width: 30px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.lim u { display: block; height: 100%; border-radius: inherit; background: var(--yellow); transition: width .4s ease; }
.lim b { font: 500 12px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.lim small { font: 11px var(--mono); color: var(--text-2); }
.lim.warm u { background: var(--amber); } .lim.warm b { color: var(--amber); }
.lim.hot u { background: var(--red); } .lim.hot b { color: var(--red); }
.lim.none b { color: var(--text-3); }
/* The heartbeat: a pulse runs along the trace, faster when the crew is busier; red when someone needs you, flat when the link is lost. */
.hb { flex: none; width: 34px; height: 14px; overflow: visible; color: var(--green); }
.hb path { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.hb .hb-base { opacity: .24; }
.hb .hb-flat { display: none; opacity: .5; }
.hb .hb-trace { stroke-width: 2; stroke-dasharray: 28 160; stroke-dashoffset: 28; filter: drop-shadow(0 0 3px currentColor); animation: beat var(--beat, 1.8s) linear infinite; }
@keyframes beat { to { stroke-dashoffset: -160; } }
.cmd-st.needs .hb { color: var(--red); }
.cmd-st.off .hb { color: var(--text-3); }
.cmd-st.off .hb-base, .cmd-st.off .hb-trace { display: none; }
.cmd-st.off .hb-flat { display: inline; }
.cmd-st.off .txt { color: var(--text-3); }
.results { position: absolute; left: 50%; width: min(100%, 560px); transform: translateX(-50%); top: calc(100% + 8px); border-radius: 16px; padding: 6px; display: none; max-height: 62vh; overflow-y: auto; background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02)), rgba(16, 16, 20, .82); scrollbar-width: thin; }
.results code svg { width: 14px; height: 14px; display: block; color: var(--text-2); }
.results .t small { margin-left: 8px; font-size: 12px; color: var(--text-3); }
.results.show { display: block; }
.results .rh { padding: 8px 10px 4px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.results button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 8px 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 9px 10px; border-radius: 10px; font-size: 13.5px; }
.results button:hover, .results button.hot { background: rgba(255, 255, 255, .08); }
.results i { width: 7px; height: 7px; border-radius: 50%; background: var(--sc); }
.results code { font: 500 12.5px var(--mono); }
.results .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .p { color: var(--text-3); font-size: 12px; }
.results button.cm { grid-template-columns: 24px minmax(0, 1fr) auto; }
.results .ci { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: rgba(255, 255, 255, .06); color: var(--text-2); }
.results .ci svg { width: 13px; height: 13px; }
.results kbd { font: 500 11px var(--mono); color: var(--text-3); border: 1px solid var(--line-2); border-radius: 6px; padding: 0 6px; }
.results .empty { padding: 10px; }
.demo-tag { font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--yellow); border: 1px solid rgba(255, 210, 31, .45); border-radius: 6px; padding: 1px 6px; }
.menu-btn { pointer-events: auto; display: none; width: var(--bar-h); height: var(--bar-h); border-radius: var(--r-chrome); }

body.term-max .speak { display: none; }
body.ws-editor .needs-bar { display: none; }

/* ---------- Editor area ---------- */
/* The canvas region between the sidebars, under the command bar and above the dock (and the terminal drawer).
   workspace.js mounts its editor here and draws its own glass: the whole area while a file is open (body.ws-editor),
   or a small tab strip over the graph when files stay open behind it. The area itself is clear and lets clicks through. */
#editor-area { position: fixed; left: calc(var(--lw) + var(--gap) * 2); right: calc(var(--rw) + var(--gap) * 2); top: var(--top-y); bottom: calc(var(--bot-y) + var(--sb) + var(--th, 0px)); z-index: 14; pointer-events: none; transition: left var(--slide) var(--ease), right var(--slide) var(--ease), bottom .25s ease; }
body.resizing #editor-area { transition: none; }
body.arranging #editor-area, body.term-max #editor-area { visibility: hidden; }

/* ---------- Quit (Mac app, contract Q) ---------- */
.modal-back { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(3, 3, 5, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade-in .18s ease; }
.modal-back[hidden] { display: none; }
.modal { position: relative; width: min(440px, 100%); padding: 24px 24px 20px; border-radius: 22px; background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02)), rgba(22, 22, 26, .9); animation: rise .24s cubic-bezier(.2, .8, .2, 1); }
.modal .hb { display: block; width: 46px; height: 18px; margin: 2px 0 16px; }
.modal h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.modal p { margin: 0 0 22px; color: var(--text-2); font-size: 13.5px; line-height: 1.55; }
.modal-acts { display: flex; justify-content: flex-end; gap: 8px; }
.modal-acts .pbtn { padding: 8px 16px; font-size: 13.5px; }
.pbtn.solid-danger { color: #FFD0D0; background: rgba(255, 107, 107, .18); box-shadow: inset 0 0 0 1px rgba(255, 107, 107, .45); }
.pbtn.solid-danger:hover { background: rgba(255, 107, 107, .28); }
@keyframes fade-in { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }

.speak { position: fixed; left: var(--mid); bottom: calc(var(--gap) + var(--sb) + 10px + var(--th, 0px)); transform: translate(-50%, 8px); display: flex; align-items: center; gap: 12px; width: max-content; max-width: min(640px, calc(100vw - 32px)); padding: 10px 10px 10px 16px; border-radius: 16px; z-index: 16; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
.speak.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.speak .tx { min-width: 0; max-height: 4.5em; line-height: 1.5; overflow: hidden; scroll-behavior: smooth; }
.speak .tx .w { opacity: 0; transition: opacity .18s ease; }
.speak .tx .w.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .speak .tx .w { transition: none; } .speak .tx { scroll-behavior: auto; } }
.speak .mute-tag { display: none; flex: none; font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 6px; }
.speak.silent .wave { display: none; }
.speak.silent .mute-tag { display: inline-block; }
.wave { display: flex; align-items: center; gap: 2px; height: 16px; flex: none; }
.wave i { width: 2.5px; height: 100%; border-radius: 2px; background: var(--yellow); animation: wave .9s ease-in-out infinite; }
.wave i:nth-child(2) { animation-delay: -.3s; } .wave i:nth-child(3) { animation-delay: -.6s; } .wave i:nth-child(4) { animation-delay: -.15s; }
@keyframes wave { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
.needs-bar { position: fixed; top: var(--top-y); left: var(--mid); transform: translate(-50%, -6px); z-index: 16; display: flex; align-items: center; gap: 12px; max-width: min(620px, calc(100vw - 32px)); padding: 10px 10px 10px 14px; border-radius: 14px; border-color: rgba(255, 107, 107, .5); background: linear-gradient(180deg, rgba(255, 107, 107, .2), rgba(255, 107, 107, .08)), rgba(24, 14, 16, .8); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
.needs-bar.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; animation: attention 1.8s ease-in-out infinite; }
.needs-bar svg { width: 18px; height: 18px; color: var(--red); flex: none; }
.needs-bar .tx { min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.needs-bar b { font-family: var(--mono); font-weight: 500; }
.needs-bar time { color: var(--text-2); font: 400 12px var(--mono); margin-left: 6px; }
.pbtn { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 10px; background: rgba(255, 255, 255, .08); font-size: 13px; white-space: nowrap; }
.pbtn:hover { background: rgba(255, 255, 255, .14); }
.pbtn:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); }
.pbtn.danger { color: var(--red); }
.unlock { position: fixed; top: var(--top-y); left: var(--mid); transform: translateX(-50%); z-index: 16; display: none; }
.unlock.show { display: block; }

/* ---------- Right panel ---------- */
.right { position: fixed; right: var(--gap); top: var(--gap); bottom: var(--gap); width: var(--pw); border-radius: 22px; z-index: 20; display: flex; flex-direction: column; overflow: hidden; transform: translateX(calc(100% + 24px)); transition: transform .28s cubic-bezier(.2, .8, .2, 1), width .25s ease; }
.right.open { transform: none; }
.right.resizing, body.resizing .top, body.resizing .sbar, body.resizing .recap { transition: none; }
.r-resize { position: absolute; top: 18px; bottom: 18px; left: 0; width: 8px; cursor: col-resize; z-index: 3; touch-action: none; }
.r-resize::after { content: ""; position: absolute; top: 50%; left: 2px; width: 3px; height: 44px; margin-top: -22px; border-radius: 3px; background: rgba(255, 255, 255, .14); opacity: 0; transition: opacity .15s linear; }
.right:hover .r-resize::after, .r-resize:focus-visible::after, .right.resizing .r-resize::after { opacity: 1; }
.r-resize:focus-visible { outline: none; }
.r-head { display: flex; align-items: center; gap: 6px; padding: 16px 12px 12px 18px; border-bottom: 1px solid var(--line); }
.r-head .ttl { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; margin-right: 4px; white-space: nowrap; }
.r-head .ttl b { font: 500 21px var(--mono); }
.r-head .ttl > span { color: var(--text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.r-head .ttl > .state { flex: none; color: var(--sc); }
.r-tools { display: flex; gap: 6px; }
.r-tools:empty { display: none; }
.r-tools .pbtn { display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; }
.r-tools svg { width: 14px; height: 14px; flex: none; }
.right.tabbed .r-head { border-bottom: 0; padding-bottom: 6px; }
.r-bar { position: relative; z-index: 4; display: none; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 14px 10px 18px; border-bottom: 1px solid var(--line); }
.right.tabbed .r-bar { display: flex; }
.r-tabs { display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); }
.r-tabs button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 8px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; transition: background-color .1s linear, color .1s linear; }
.r-tabs button:hover { color: var(--text); }
.r-tabs button[aria-selected="true"] { background: rgba(255, 255, 255, .1); color: var(--text); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
.r-tabs button:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); }
.r-hint { flex-basis: 100%; margin: 2px 0 0; font-size: 12px; line-height: 1.4; color: var(--text-3); }
.r-acts { margin-left: auto; display: flex; gap: 6px; }
.r-acts .pbtn { padding: 5px 10px; font-size: 12.5px; }
.r-confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px 10px 18px; border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .03); }
.r-confirm:empty { display: none; }
.r-confirm p { margin: 0; flex-basis: 100%; font-size: 12.5px; color: var(--text-2); }
.r-confirm .pbtn { padding: 5px 10px; font-size: 12.5px; }
.r-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 20px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .12) transparent; }
.right[data-tab="convo"] .r-body { display: none; }

/* Conversation: the chat log, like the VS Code panel */
.r-convo { display: none; flex: 1; min-height: 0; flex-direction: column; }
.right[data-tab="convo"] .r-convo { display: flex; }
.cv-wrap { position: relative; flex: 1; min-height: 0; }
.cv-scroll { position: absolute; inset: 0; overflow-y: auto; padding: 16px 18px 18px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .12) transparent; }
.cv-scroll:focus-visible { outline: none; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35); }
.cv-top { font-size: 12px; color: var(--text-3); text-align: center; margin-bottom: 12px; }
.cv-top:empty { display: none; }
.cv-empty { color: var(--text-3); font-size: 13.5px; text-align: center; padding: 28px 12px; }
.cv-empty:empty { display: none; }
.cv-empty b { display: block; color: var(--text-2); font-weight: 500; margin-bottom: 4px; }
.cv-log > * + * { margin-top: 14px; }
.cv-log > .cv-tool + .cv-tool { margin-top: 2px; }
.cv-user { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.cv-user time { font: 400 11px var(--mono); color: var(--text-3); padding-right: 4px; }
.cv-bubble { max-width: 88%; padding: 9px 13px; border-radius: 16px 16px 6px 16px; background: linear-gradient(180deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .07)); border: 1px solid var(--line-2); font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.cv-bubble.clamp { max-height: 15em; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }
.cv-asst { font-size: 13.5px; line-height: 1.6; color: var(--text); overflow-wrap: anywhere; }
.cv-notice { text-align: center; font-size: 12px; color: var(--text-3); padding: 0 12px; overflow-wrap: anywhere; }
.cv-notice.int { display: flex; align-items: center; gap: 10px; color: var(--amber); }
.cv-notice.int::before, .cv-notice.int::after { content: ""; flex: 1; height: 1px; background: rgba(244, 182, 89, .25); }
.cv-tool { border-radius: 10px; }
/* A tool row: the toggle button covers the whole row; the file path (Read, Edit, Write…) is its own link on top of it. */
.cv-row { position: relative; display: grid; grid-template-columns: 8px auto minmax(0, 1fr) 14px; gap: 9px; align-items: center; padding: 6px 8px; border-radius: 9px; font-size: 13px; transition: background-color .1s linear; }
.cv-row:hover { background: rgba(255, 255, 255, .05); }
.cv-trow { all: unset; box-sizing: border-box; cursor: pointer; position: absolute; inset: 0; border-radius: 9px; }
.cv-trow:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); }
.cv-row > :not(button) { position: relative; pointer-events: none; }
.cv-row > i { width: 7px; height: 7px; border-radius: 50%; background: rgba(91, 228, 155, .8); }
.cv-row > b { font: 500 12.5px var(--mono); color: var(--text); white-space: nowrap; }
.cv-row > span { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cv-row > svg { width: 14px; height: 14px; color: var(--text-3); transform: rotate(-90deg); transition: transform .15s ease; }
.cv-row { grid-template-columns: 8px auto minmax(0, 1fr) auto 14px; }
.cv-row > time { font: 400 11px var(--mono); color: rgba(255, 255, 255, .3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cv-tool.open .cv-row > svg { transform: none; }
.cv-tool.run .cv-row > i { background: #fff; animation: live 1.6s ease-in-out infinite; }
.cv-tool.run .cv-row > span { color: var(--text); }
.cv-tool.err .cv-row > i { background: var(--red); }
.cv-tool.err .cv-row > b, .cv-tool.err .cv-row > span { color: var(--red); }
.cv-flink { all: unset; box-sizing: border-box; cursor: pointer; position: relative; z-index: 1; justify-self: start; max-width: 100%; font: 400 12.5px var(--mono); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-bottom: 1px dotted rgba(255, 255, 255, .3); transition: color .1s linear, border-color .1s linear; }
.cv-flink:hover { color: var(--text); border-bottom: 1px solid rgba(255, 255, 255, .6); }
.cv-flink:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); outline-offset: 2px; border-radius: 3px; }
.cv-flink.ed { color: #FFE58A; border-bottom-color: rgba(255, 210, 31, .4); }
.cv-flink.ed:hover { color: #FFF1B8; border-bottom-color: rgba(255, 210, 31, .8); }
.cv-tool.err .cv-flink { color: #FF9C9C; }
.cv-tbody { margin: 4px 0 8px 25px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0, 0, 0, .3); overflow: hidden; }
.cv-io { display: grid; grid-template-columns: 38px minmax(0, 1fr); }
.cv-io + .cv-io { border-top: 1px solid var(--line); }
.cv-io > b { font: 500 10px var(--mono); letter-spacing: .08em; color: var(--text-3); padding: 10px 0 0 10px; }
.cv-io pre { margin: 0; padding: 8px 10px 8px 0; font: 400 12px/1.55 var(--mono); color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.cv-io.err { background: rgba(255, 107, 107, .06); }
.cv-io.err > b, .cv-io.err pre { color: #FF9C9C; }
.cv-io .wait { color: var(--text-3); }
.cv-more { all: unset; cursor: pointer; display: inline-block; margin: 0 0 8px; padding: 2px 8px; border-radius: 7px; font-size: 11.5px; color: var(--text-2); border: 1px solid var(--line-2); }
.cv-more:hover { background: rgba(255, 255, 255, .08); color: var(--text); }
.cv-more:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); }
.cv-user .cv-more { margin: 0; }
.cv-live { display: flex; align-items: center; gap: 9px; margin-top: 16px; padding: 0 8px; font-size: 12.5px; color: var(--text-2); }
.cv-live:empty { display: none; }
.cv-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--sc); flex: none; animation: live 1.6s ease-in-out infinite; }
.cv-live .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cv-live.needs-you .what { color: var(--red); }
.cv-new { all: unset; box-sizing: border-box; cursor: pointer; position: absolute; left: 50%; bottom: 12px; transform: translate(-50%, 6px); display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 14px; border-radius: 999px; font-size: 12.5px; color: var(--text); background: rgba(32, 32, 36, .92); border: 1px solid var(--line-2); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .15s ease, transform .15s ease, visibility 0s linear .15s; }
.cv-new.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); pointer-events: auto; transition: opacity .15s ease, transform .15s ease; }
.cv-new:hover { background: rgba(44, 44, 50, .95); }
.cv-new:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); }
.cv-new svg { width: 13px; height: 13px; }
/* The panel is a live view; the terminal is where you talk to a chat. This one-line footer says so. */
.cv-foot { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px 12px; border-top: 1px solid var(--line); background: rgba(0, 0, 0, .16); font-size: 12.5px; color: var(--text-3); text-align: center; }
.cv-foot:empty { display: none; }
.cv-foot svg { width: 14px; height: 14px; flex: none; }
.cv-foot b { color: var(--text-2); font-weight: 500; }
/* Timestamps: every entry has its time (full date on hover); a separator marks gaps of more than 5 minutes. */
.cv-by { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; font: 400 11px var(--mono); color: var(--text-3); }
.cv-by b { font-weight: 500; color: var(--text-2); }
.cv-sep { display: flex; align-items: center; gap: 12px; margin: 22px 0 16px; font: 500 11px var(--mono); letter-spacing: .02em; color: var(--text-3); }
.cv-sep::before, .cv-sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.cv-log > .cv-sep:first-child { margin-top: 4px; }
.cv-log > .cv-sep + * { margin-top: 0; }
.cv-notice time { margin-left: 6px; font: 400 11px var(--mono); color: var(--text-4); }
.cv-live .cv-ago { flex: none; font: 400 11.5px var(--mono); color: var(--text-3); }
/* A brief line from the crew after an instant action (Interrupt) */
.r-toast { position: absolute; right: 14px; top: calc(100% + 8px); z-index: 5; max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 12px; font-size: 13px; color: var(--text); background: rgba(30, 30, 35, .97); border: 1px solid var(--line-2); box-shadow: 0 14px 34px rgba(0, 0, 0, .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
.r-toast.show { opacity: 1; transform: none; }
.r-toast b { font: 500 12.5px var(--mono); margin-right: 6px; }

/* Markdown, for assistant text */
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 9px; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 14px 0 6px; font-weight: 600; line-height: 1.3; }
.md h1 { font-size: 17px; } .md h2 { font-size: 15.5px; } .md h3 { font-size: 14.5px; } .md h4, .md h5, .md h6 { font-size: 13.5px; color: var(--text-2); }
.md strong { font-weight: 600; }
.md code { font: 400 12.5px var(--mono); padding: 1px 5px; border-radius: 6px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); overflow-wrap: anywhere; }
.md pre { margin: 8px 0 10px; padding: 10px 12px; border-radius: 10px; background: rgba(0, 0, 0, .35); border: 1px solid var(--line); overflow-x: auto; font: 400 12px/1.55 var(--mono); scrollbar-width: thin; }
.md pre code { padding: 0; border: 0; background: none; font-size: inherit; overflow-wrap: normal; white-space: pre; }
.md ul, .md ol { margin: 4px 0 9px; padding-left: 20px; }
.md li { margin: 2px 0; }
.md li > ul, .md li > ol { margin: 2px 0; }
.md li::marker { color: var(--text-3); }
.md a { color: var(--text); text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .35); text-underline-offset: 2px; }
.md a:hover { text-decoration-color: var(--text); }
.md .md-ref { border-bottom: 1px dotted var(--text-3); }
.md blockquote { margin: 8px 0; padding-left: 10px; border-left: 2px solid var(--line-2); color: var(--text-2); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.md table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 8px 0 10px; font-size: 12.5px; }
.md th, .md td { border: 1px solid var(--line-2); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: rgba(255, 255, 255, .05); font-weight: 500; }
.box { padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); margin-bottom: 12px; }

<script>
// Page errors go to the server log (~/.pulse/pulse.log): the Mac app has no console open, so this is how a problem there
// gets traced. Its own script block, so it still reports when the main script fails to load.
(function () {
    let n = 0;
    const send = (msg) => { if (n++ < 30) fetch("/client-log", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ msg: String(msg).slice(0, 2000), app: !!window.pulseDesktop }) }).catch(() => {}); };
    addEventListener("error", (e) => send(`${e.message} at ${e.filename}:${e.lineno}:${e.colno}${e.error?.stack ? `\n${e.error.stack}` : ""}`));
    addEventListener("unhandledrejection", (e) => send(`Unhandled: ${e.reason?.stack || e.reason}`));
    window.pulseLog = send;
    // A page that loaded a half-saved file (the server tells open pages to reload the moment a page file changes) has no
    // working script, so it can't hear the next reload either and would sit there looking fine but doing nothing. The
    // main script marks itself ready; until it does, this reloads the page, a few times at most.
    let tries = 0;
    try { tries = +sessionStorage.getItem("pulse.revive") || 0; } catch {}
    setTimeout(function revive() {
        if (window.__pulseReady) { try { sessionStorage.removeItem("pulse.revive"); } catch {} return; }
        if (tries >= 5) return send("The page script never started, even after 5 reloads");
        try { sessionStorage.setItem("pulse.revive", String(tries + 1)); } catch {}
        location.reload();
    }, 6000);
})();
</script>

// under half a second and differs in rhythm and timbre, not only pitch. Notes are [Hz, start s, length s, wave, gain].
const EARCONS = {
    tick: [[1318, 0, 0.06, "sine", 0.045]],
    done: [[659, 0, 0.11, "sine", 0.07], [988, 0.09, 0.2, "sine", 0.07]],
    wrap: [[523, 0, 0.12, "sine", 0.06], [659, 0.08, 0.12, "sine", 0.06], [784, 0.16, 0.26, "sine", 0.07]],
    fail: [[196, 0, 0.13, "triangle", 0.12], [185, 0.17, 0.2, "triangle", 0.12]],

// ---------- Plan limits in the top bar: the 5-hour and weekly windows, from Claude Code's status line (scripts/pulse-statusline.sh) ----------

let leaveTimer = 0;

// ============ Workspace: Files, Changes and the editor (workspace.js, contract G) ============
// The activity bar picks the sidebar's view. Files and Changes show one project folder: the one picked in the menu at
// their top, else the selected agent's, else the most recently active. workspace.js loads after this script (defer), so
// every call into it is guarded. Function declarations only: setRail() reaches syncWs() while the page is still loading.
function wsCall(fn, ...args) {
    const w = window.PulseWorkspace;

    try { w[fn](...args); return true; } catch (err) { console.warn(`PulseWorkspace.${fn} failed`, err); return false; }
}
function wsProjects() {
    const map = new Map();
    for (const s of S.snap?.sessions || []) {
        if (!s.cwd) continue;
        const at = s.lastAt || s.startedAt || 0, n = (s.agents || []).filter((a) => live(state(a))).length, p = map.get(s.cwd);
        if (!p) map.set(s.cwd, { cwd: s.cwd, name: s.project || base(s.cwd), branch: s.branch || "", at, live: n });
        else { p.live += n; if (at >= p.at) { p.at = at; p.branch = s.branch || p.branch; } }
    }
    // Folders opened with Open folder… (remembered here, and listed by the server when it knows them).
    const opened = [...WS.extra, ...[].concat(S.snap?.workspaces || []).map((w) => (typeof w === "string" ? w : w?.root || w?.path))];
    for (const cwd of opened) if (typeof cwd === "string" && cwd && !map.has(cwd)) map.set(cwd, { cwd, name: base(cwd.replace(/\/+$/, "")) || cwd, branch: "", at: 0, live: 0 });

}
function wsRoot(list = wsProjects()) {
    if (WS.pick && list.some((p) => p.cwd === WS.pick)) return WS.pick;
    const sel = S.snap && S.selected ? model().find((t) => t.key === S.selected) : null;
    const root = sel?.project.cwd || list[0]?.cwd || "";

    if (root && S.snap) { WS.pick = root; store("wsRoot", root); }

}
// Like VS Code: the open view's button folds the sidebar away; any other opens its view.
function modeButton(m) {
    if (m === WS.mode && !$("left").classList.contains("rail") && innerWidth > 760) { store("rail", "1"); return setRail(true); }
    setMode(m);
}
function setMode(m, focus = false) {

    else if ($("left").classList.contains("rail")) { store("rail", "0"); setRail(false); }

    if (!focus) return;

    (box.querySelector(".a-row.sel, [aria-selected='true'], [tabindex='0']") || box.querySelector("button, input") || (m === "crew" ? $("m-crew") : $("ws-pick"))).focus({ preventScroll: true });
}
function syncWs() {
    const L = $("left"), rail = L.classList.contains("rail") && innerWidth > 760;
    if (L.dataset.mode !== WS.mode) L.dataset.mode = WS.mode;
    for (const b of L.querySelectorAll(".act-btn[data-mode]")) { const on = b.dataset.mode === WS.mode; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); }
    const list = wsProjects(), root = wsRoot(list), p = list.find((x) => x.cwd === root);
    if (root !== WS.root) { WS.root = root; openPick(false); if (root) wsCall("setRoot", root); if (S.snap) render(); }
    refreshGit();
    const g = WS.git, known = g.root === root, branch = (known && g.branch) || p?.branch || "";
    setHtml($("ws-pick"), `<span class="c-ic">${I.folder}</span><span class="pick-t">${p ? `<b>${esc(p.name)}</b><span>${esc(tilde(p.cwd))}${branch ? ` · ${esc(branch)}` : ""}</span>` : `<b>No project yet</b><span>${DESKTOP ? "Open a folder, or start a session" : "Start a Claude session in a folder"}</span>`}</span>${I.chev}`);
    $("ws-pick").setAttribute("aria-label", p ? `Project ${p.name}. Choose another project` : "Choose a project");
    const changes = WS.mode === "changes";
    $("ws-title").textContent = changes ? "Changes" : "Files";
    const note = WS.note || (changes && known ? (g.n ? `${g.n} changed` : g.repo === false ? "Not a git repository" : g.repo ? "Clean" : "") : "");
    if ($("ws-note").textContent !== note) $("ws-note").textContent = note;
    $("ws-note").classList.toggle("warn", !!WS.note);

}
function mountView(mode, root) {

    const session = mode === "changes" && sel && sel.kind !== "project" && sel.project.cwd === root ? sel.session.id : null;
    const ready = !!window.PulseWorkspace, sig = `${root}|${session || ""}|${ready}|${WS.loaded}`;

    if (!ready) { el.innerHTML = `<div class="ws-empty">${WS.loaded ? "<b>Files aren't available</b>This Pulse server doesn't include the file explorer yet. Restart Pulse to update it." : "Loading…"}</div>`; return; }
    if (el.firstElementChild?.classList.contains("ws-empty")) el.textContent = ""; // a remount keeps workspace.js's own DOM

// The Changes badge: how many files differ from HEAD in the current project, checked on snapshots at most every 5 s.
function refreshGit(force = false) {

// ============ Quit (Mac app, contract Q) ============

// ============ Page API (contract H) ============

// A page file changed on disk (index.html, terminal/workspace/intro js or css): load the new version. The path alone
